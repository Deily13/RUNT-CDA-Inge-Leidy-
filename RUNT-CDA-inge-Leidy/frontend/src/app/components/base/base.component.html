<!-- ── Layered Background ─────────────────────────────── -->
<div class="bg-canvas" aria-hidden="true"></div>
<div class="bg-vignette" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<!-- ── Application Shell ─────────────────────────────── -->
<div id="app">

    <!-- ── Top Navigation Bar ──────────────────────────── -->
    <nav class="topbar" role="navigation" aria-label="Barra principal">

        <!-- Hamburger -->
        <button class="btn-hamburger" id="menuToggle" aria-expanded="false" aria-controls="sideDrawer"
            [class.active]="isDrawerOpen" (click)="toggleDrawer()" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Right actions -->
        <div class="nav-actions">
            <button class="btn-nav" aria-label="Inicio" (click)="goHome()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                Inicio
            </button>
            <button class="btn-nav danger" id="logoutBtn" aria-label="Cerrar sesión" (click)="logout()">
                <!-- Logout icon -->
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Cerrar Sesión
            </button>
        </div>
    </nav>

    <!-- ── Drawer Overlay ───────────────────────────────── -->
    <div class="drawer-overlay" id="drawerOverlay" [class.open]="isDrawerOpen" (click)="closeDrawer()">
        aria-hidden="true"></div>

    <!-- ── Side Drawer ──────────────────────────────────── -->
    <aside class="drawer" id="sideDrawer" [class.open]="isDrawerOpen" role="complementary" aria-label="Menú lateral">
        <div class="drawer-header">
            <span class="drawer-logo">Sistema</span>
        </div>

        <nav class="drawer-nav" aria-label="Opciones del sistema">

            <!-- BÚSQUEDA -->
            <p class="menu-section">Consultas</p>
            <a class="menu-item" (click)=" onSearch()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                Buscar
            </a>

            <div class="menu-divider"></div>

            <!-- REGISTROS -->
            <p class="menu-section">Registros</p>
            <a class="menu-item" (click)="onNew()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="12" y1="18" x2="12" y2="12" />
                    <line x1="9" y1="15" x2="15" y2="15" />
                </svg>
                Nuevo Registro
            </a>
            <a class="menu-item" (click)="onUpdate()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" />
                    <polyline points="17 21 17 13 7 13 7 21" />
                    <polyline points="7 3 7 8 15 8" />
                </svg>
                Actualizar Registro
            </a>
            <a href="#registros-pendientes" class="menu-item" data-action="registros-pendientes">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                Registros Pendientes
            </a>

            <div class="menu-divider"></div>

            <!-- PLACA -->
            <p class="menu-section">Gestión de Placa</p>
            <a href="#gestionar-placa" class="menu-item" data-action="gestionar-placa">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" />
                    <path d="M16 3v4M8 3v4" />
                </svg>
                Gestionar Placa
            </a>
            <a href="#actualizar-placa" class="menu-item" data-action="actualizar-placa">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10" />
                    <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10" />
                </svg>
                Guardado Rapido
            </a>

            <div class="menu-divider"></div>

            <!-- REPORTES -->
            <p class="menu-section">Reportes</p>
            <a href="#reporte-mes" class="menu-item" data-action="reporte-mes">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="3" y1="9" x2="21" y2="9" />
                    <line x1="3" y1="15" x2="21" y2="15" />
                    <line x1="9" y1="3" x2="9" y2="21" />
                </svg>
                Ver Reporte de Mes
            </a>

            <div class="menu-divider"></div>

            <!-- EXTERNAS -->
            <p class="menu-section">Servicios Externos</p>
            <a href="https://portalpublico.runt.gov.co/#/consulta-vehiculo/consulta/consulta-ciudadana"
                class="menu-item" target="_blank" rel="noopener" data-action="runt">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="2" y1="12" x2="22" y2="12" />
                    <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" />
                </svg>
                RUNT
            </a>
            <a href="https://www.previsora.gov.co/cotizar-soat1" class="menu-item" target="_blank" rel="noopener"
                data-action="soat-previsora">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                SOAT Previsora
            </a>

            <div class="menu-divider"></div>

            <!-- SESIÓN -->
            <button class="menu-item danger" data-action="cerrar-sesion"
                onclick="document.getElementById('logoutBtn').click()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Cerrar Sesión
            </button>

        </nav>
    </aside>

    <router-outlet></router-outlet>
</div><!-- /#app -->
