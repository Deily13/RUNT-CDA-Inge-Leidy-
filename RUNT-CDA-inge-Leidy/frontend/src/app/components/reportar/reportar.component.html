<div class="vf-wrapper">

    <!-- ── Panel búsqueda ─────────────────────────────────────── -->
    <div class="vf-search-panel">
        <span class="vf-search-label">
            {{ 'Escribe la placa que deseas gestionar' }}
        </span>

        <input class="vf-search-input" type="text" [placeholder]="'ABC123'"
            [(ngModel)]="searchPlate" (ngModelChange)="onSearchChange($event)" maxlength="6" autocomplete="off" />

        <!-- Limpiar -->
        <button class="vf-search-btn" type="button" (click)="clearSearch()" title="Limpiar">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M4 4l10 10M14 4L4 14" stroke="#fff" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>

        <!-- Buscar -->
        <button class="vf-search-btn" type="button" (click)="searchVehicle()" title="Buscar">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="8.5" cy="8.5" r="5.5" stroke="#34D399" stroke-width="2" />
                <path d="M12.5 12.5L17 17" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
    </div>
</div>
<app-mensaje></app-mensaje>
