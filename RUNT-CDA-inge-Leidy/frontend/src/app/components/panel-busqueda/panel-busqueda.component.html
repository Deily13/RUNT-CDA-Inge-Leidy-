<div class="card">

    <!-- ── Header ─────────────────────────────────────────── -->
    <div class="card-header">
        <span class="header-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
            </svg>
        </span>
        <h2>Filtros de Búsqueda</h2>
    </div>

    <!-- ── Grid de filtros ─────────────────────────────────── -->
    <div class="filters-grid">

        <!-- Fecha Específica -->
        <div class="filter-field">
            <label class="field-label" for="fecha">Fecha Específica</label>
            <input id="fecha" type="date" class="filter-input" [(ngModel)]="fecha" placeholder="mm/dd/aaaa" />
        </div>

        <!-- Mes -->
        <div class="filter-field">
            <label class="field-label" for="mes">Mes</label>
            <div class="select-wrap">
                <select id="mes" class="filter-select" [(ngModel)]="mes">
                    <option value="" disabled>Mes</option>
                    <option *ngFor="let m of meses" [value]="m">{{ m }}</option>
                </select>
            </div>
        </div>

        <!-- Año -->
        <div class="filter-field">
            <label class="field-label" for="anio">Año</label>
            <div class="select-wrap">
                <select id="anio" class="filter-select" [(ngModel)]="anio">
                    <option value="" disabled>Año</option>
                    <option *ngFor="let a of anios" [value]="a">{{ a }}</option>
                </select>
            </div>
        </div>

        <!-- Categoría de Vehículo -->
        <div class="filter-field">
            <label class="field-label" for="categoria">Categoría de Vehículo</label>
            <div class="select-wrap">
                <select id="categoria" class="filter-select" [(ngModel)]="categoria">
                    <option value="" disabled>Seleccione categoría</option>
                  <option *ngFor="let cat of categoriasVehiculo" [value]="cat.value">{{ cat.label }}</option>                </select>
            </div>
        </div>

        <!-- Número de Documento -->
        <div class="filter-field">
            <label class="field-label" for="numeroDocumento">Número de Documento</label>
            <input id="numeroDocumento" type="text" class="filter-input" [(ngModel)]="numeroDocumento"
                placeholder="número de documento" min="5"  maxlength="13" inputmode="numeric" pattern="\d*"  />
        </div>

        <!-- Placa -->
        <div class="filter-field">
            <label class="field-label" for="placa">Placa</label>
            <input id="placa" type="text" class="filter-input" [ngModel]="placa"
                (ngModelChange)="placa = $event.toUpperCase()" placeholder="ej: ABC123" maxlength="6" />
        </div>

        <!-- Tipo de Documento -->
        <div class="filter-field">
            <label class="field-label" for="tipoDocumento">Tipo de Documento</label>
            <div class="select-wrap">
                <select id="tipoDocumento" class="filter-select" [(ngModel)]="tipoDocumento">
                    <option value="" disabled>Tipo de documento</option>
                    <option *ngFor="let tipo of tiposDocumento" [value]="tipo">{{ tipo }}</option>
                </select>
            </div>
        </div>

        <!-- Estado (multi-checkbox) -->
        <div class="filter-field span-2">
            <label class="field-label">Estado</label>
            <div class="multi-select-wrap">

                <!-- Trigger -->
                <div class="multi-trigger" [class.open]="estadoDropdownAbierto()" tabindex="0"
                    (click)="toggleDropdownEstado()" (keydown)="onKeydownTrigger($event)">
                    <span class="multi-trigger-text" [class.has-value]="tieneEstados()">
                        {{ estadoTexto() }}
                    </span>
                    <span class="multi-trigger-caret"></span>
                </div>

                <!-- Dropdown -->
                <div class="multi-dropdown" [class.open]="estadoDropdownAbierto()">
                    <label *ngFor="let op of estadoOpciones(); let i = index" class="multi-option">
                        <input type="checkbox" [checked]="op.checked" (change)="toggleEstado(i)" />
                        {{ op.label }}
                    </label>
                </div>

            </div>
        </div>

        <!-- Botones de acción -->
        <div class="filter-field actions-row">
            <button class="btn btn-search" title="Buscar" type="button" (click)="onBuscar()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
            </button>

            <button class="btn btn-clear" title="Limpiar filtros" type="button" (click)="onLimpiar()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>

    </div><!-- /filters-grid -->
</div><!-- /card -->

<tabla-registro></tabla-registro>
